<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolNexa - Free Online Tools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .tool-card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .tool-card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 12px;
      padding: 12px;
      background: #eef2ff;
      border-radius: 8px;
      font-weight: bold;
      min-height: 20px;
    }

    .password-box {
      display: flex;
      gap: 8px;
    }

    .password-box input {
      flex: 1;
    }

    .password-box button {
      width: 90px;
    }

    .range-value {
      text-align: center;
      font-weight: bold;
      margin: 5px 0;
    }

    .options {
      margin: 10px 0;
    }

    .options label {
      display: block;
      margin: 7px 0;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      margin-top: 30px;
      background: #111827;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolNexa</h1>
  <p>Simple & Free Online Tools</p>
</header>

<div class="container">

  <div class="tools-grid">

    <!-- Age Calculator -->
    <div class="tool-card">
      <h2>🎂 Age Calculator</h2>

      <label>Date of Birth:</label>
      <input type="date" id="dob">

      <button onclick="calculateAge()">Calculate Age</button>

      <div class="result" id="ageResult"></div>
    </div>


    <!-- Percentage Calculator -->
    <div class="tool-card">
      <h2>📊 Percentage Calculator</h2>

      <input type="number" id="percentage" placeholder="Enter percentage">

      <input type="number" id="number" placeholder="Enter number">

      <button onclick="calculatePercentage()">Calculate</button>

      <div class="result" id="percentageResult"></div>
    </div>


    <!-- Word Counter -->
    <div class="tool-card">
      <h2>📝 Word Counter</h2>

      <textarea id="textInput"
        placeholder="Type or paste your text here..."
        oninput="countWords()"></textarea>

      <div class="result" id="wordResult">
        Words: 0<br>
        Characters: 0<br>
        Sentences: 0
      </div>

      <button onclick="clearText()">Clear Text</button>
    </div>


    <!-- Password Generator -->
    <div class="tool-card">
      <h2>🔐 Password Generator</h2>

      <div class="password-box">
        <input type="text" id="password" readonly placeholder="Your password">
        <button onclick="copyPassword()">Copy</button>
      </div>

      <label>Password Length:</label>

      <input
        type="range"
        id="length"
        min="6"
        max="32"
        value="16"
        oninput="updateLength()"
      >

      <div class="range-value">
        Length: <span id="lengthValue">16</span>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" id="uppercase" checked>
          Uppercase Letters
        </label>

        <label>
          <input type="checkbox" id="lowercase" checked>
          Lowercase Letters
        </label>

        <label>
          <input type="checkbox" id="numbers" checked>
          Numbers
        </label>

        <label>
          <input type="checkbox" id="symbols" checked>
          Symbols
        </label>
      </div>

      <button onclick="generatePassword()">Generate Password</button>
    </div>

  </div>

</div>

<footer>
  © 2026 ToolNexa. All rights reserved.
</footer>


<script>

  // Age Calculator
  function calculateAge() {
    const dobInput = document.getElementById("dob").value;
    const result = document.getElementById("ageResult");

    if (!dobInput) {
      result.innerHTML = "Please select your date of birth.";
      return;
    }

    const dob = new Date(dobInput);
    const today = new Date();

    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();

    if (days < 0) {
      months--;

      const previousMonth = new Date(
        today.getFullYear(),
        today.getMonth(),
        0
      );

      days += previousMonth.getDate();
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    result.innerHTML =
      years + " Years, " +
      months + " Months, " +
      days + " Days";
  }


  // Percentage Calculator
  function calculatePercentage() {
    const percentage =
      parseFloat(document.getElementById("percentage").value);

    const number =
      parseFloat(document.getElementById("number").value);

    const result =
      document.getElementById("percentageResult");

    if (isNaN(percentage) || isNaN(number)) {
      result.innerHTML = "Please enter both values.";
      return;
    }

    const answer = (percentage / 100) * number;

    result.innerHTML =
      percentage + "% of " + number + " = " + answer;
  }


  // Word Counter
  function countWords() {
    const text =
      document.getElementById("textInput").value;

    const words =
      text.trim() === ""
        ? 0
        : text.trim().split(/\s+/).length;

    const characters = text.length;

    const sentences =
      text.trim() === ""
        ? 0
        : (text.match(/[.!?]+/g) || []).length;

    document.getElementById("wordResult").innerHTML =
      "Words: " + words +
      "<br>Characters: " + characters +
      "<br>Sentences: " + sentences;
  }


  // Clear Text
  function clearText() {
    document.getElementById("textInput").value = "";

    document.getElementById("wordResult").innerHTML =
      "Words: 0<br>Characters: 0<br>Sentences: 0";
  }


  // Password Length
  function updateLength() {
    const length =
      document.getElementById("length").value;

    document.getElementById("lengthValue").textContent =
      length;
  }


  // Password Generator
  function generatePassword() {

    const length =
      parseInt(document.getElementById("length").value);

    const uppercase =
      document.getElementById("uppercase").checked;

    const lowercase =
      document.getElementById("lowercase").checked;

    const numbers =
      document.getElementById("numbers").checked;

    const symbols =
      document.getElementById("symbols").checked;

    let characters = "";

    if (uppercase) characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (lowercase) characters += "abcdefghijklmnopqrstuvwxyz";
    if (numbers) characters += "0123456789";
    if (symbols) characters += "!@#$%^&*()_+-=[]{}|;:,.<>?";

    if (characters === "") {
      alert("Please select at least one option.");
      return;
    }

    let password = "";

    const randomValues = new Uint32Array(length);
    crypto.getRandomValues(randomValues);

    for (let i = 0; i < length; i++) {
      password +=
        characters[randomValues[i] % characters.length];
    }

    document.getElementById("password").value = password;
  }


  // Copy Password
  function copyPassword() {

    const password =
      document.getElementById("password").value;

    if (!password) {
      alert("Generate a password first.");
      return;
    }

    if (navigator.clipboard) {
      navigator.clipboard.writeText(password)
        .then(() => {
          alert("Password copied!");
        })
        .catch(() => {
          alert("Copy failed. Please copy manually.");
        });
    } else {
      const input =
        document.getElementById("password");

      input.select();
      document.execCommand("copy");

      alert("Password copied!");
    }
  }

</script>

</body>
</html>
